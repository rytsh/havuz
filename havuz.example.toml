# havuz bootstrap configuration.
#
# Only process-level settings live here: the bind address, TLS material and
# where state is kept. Pools and users are managed through the dashboard or the
# admin API and stored in `state.json`, because they change at runtime and
# restarting a pooler to add a database is not acceptable.
#
# Note what is *not* here: a client port. Each pool declares the port it is
# reached on, so ports move without a restart. Pools may share a port, in which
# case the database name in the connection string picks between them:
#
#   one pool on :6432      postgresql://svc_orders:***@havuz:6432/anything
#   two pools on :6432     postgresql://svc_orders:***@havuz:6432/app_main
#
# Start with:  HAVUZ_MASTER_KEY=$(havuz keygen) havuz run --config havuz.toml

[server]
# Interface every pool port is bound on. Address only; the ports come from the
# pools themselves.
bind = "0.0.0.0"

# 0 means one worker per core.
workers = 0

# Hard ceiling across every pool port, enforced at accept time. Protects the
# process from file descriptor exhaustion before per-pool limits get a chance
# to apply.
max_client_connections = 1000

[server.tls]
# TLS for the client-facing listeners. Both must be set, or neither: without
# them havuz declines SSLRequest and clients fall back to plaintext, exactly as
# they would against a Postgres built without TLS.
#
# Required for pools with `backend_auth = per_user`, which ask each client for
# its password and refuse to do so over an unencrypted socket.
# cert = "/etc/havuz/tls/server.crt"
# key  = "/etc/havuz/tls/server.key"
require_client_cert = false

[admin]
# The HTTP API and the dashboard. Loopback by default on purpose: this endpoint
# can repoint a pool at another database. This port is reserved: a pool that
# asks for it is refused rather than silently losing the race for the socket.
listen = "127.0.0.1:7432"

# On a non-loopback address havuz refuses to start without authentication.
# auth = { type = "bearer", token_env = "HAVUZ_ADMIN_TOKEN" }

# Serve the embedded dashboard. Disable for headless deployments.
ui = true

[state]
# Holds state.json, which contains sealed credentials. Written with mode 0600.
#
# Also holds traces.sqlite3, the query trace history. How much each pool puts
# there is the pool's own `trace` setting — `off`, `statements` (the default) or
# `full`, which additionally keeps a sample of the rows queries returned. Set it
# per pool from the dashboard or the admin API, not here: it is a property of
# the data behind a pool, not of the process.
dir = "./data"

[log]
# `tracing` directives, e.g. "info,havuz_pg=debug". RUST_LOG overrides this.
filter = "info"
json = false
log_connections = false
