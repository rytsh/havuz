[workspace]
resolver = "2"
members = ["crates/havuz-registry", "crates/havuz-secrets", "crates/havuz-core", "crates/havuz-proto", "crates/havuz-pool", "crates/havuz-control", "crates/havuz-pg", "crates/havuz-jdbc", "crates/havuz-admin", "crates/havuz-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "Apache-2.0"
repository = "https://github.com/rytsh/havuz"

[workspace.dependencies]
havuz-registry = { path = "crates/havuz-registry" }
havuz-secrets = { path = "crates/havuz-secrets" }
havuz-core = { path = "crates/havuz-core" }
havuz-proto = { path = "crates/havuz-proto" }
havuz-stats = { path = "crates/havuz-stats" }
havuz-pool = { path = "crates/havuz-pool" }
havuz-control = { path = "crates/havuz-control" }
havuz-pg = { path = "crates/havuz-pg" }
havuz-jdbc = { path = "crates/havuz-jdbc" }
havuz-admin = { path = "crates/havuz-admin" }

# runtime
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
async-trait = "0.1"

# data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
bytes = "1"
arc-swap = "1"
uuid = { version = "1", features = ["v4", "serde"] }
humantime-serde = "1"

# errors / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# crypto / tls
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
webpki-roots = "0.26"
rustls-pki-types = "1"
aes-gcm = "0.10"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
rand = "0.8"
base64 = "0.22"
stringprep = "0.1"

# http / admin
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "cors", "set-header"] }
mime_guess = "2"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }

# control plane
tokio-postgres = { version = "0.7", features = ["with-uuid-1"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.bench]
lto = "thin"
codegen-units = 1
