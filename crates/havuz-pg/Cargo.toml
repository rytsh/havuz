[package]
name = "havuz-pg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PostgreSQL wire protocol driver for havuz."

[dependencies]
havuz-core = { workspace = true }
havuz-control = { workspace = true }
havuz-proto = { workspace = true }
havuz-registry = { workspace = true }
havuz-pool = { workspace = true }
havuz-secrets = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pki-types = { workspace = true }

hmac = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
stringprep = { workspace = true }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "io-util"] }
tempfile = "3"
