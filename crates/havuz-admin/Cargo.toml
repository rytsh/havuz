[package]
name = "havuz-admin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Admin HTTP API and dashboard for havuz."

[features]
default = []
# Bake ui/dist into the binary. Off by default so a Rust-only build never
# depends on a Node toolchain having run first.
embed-ui = ["dep:rust-embed"]

[dependencies]
havuz-control = { workspace = true }
havuz-core = { workspace = true }
havuz-pool = { workspace = true }
havuz-proto = { workspace = true }
havuz-registry = { workspace = true }
havuz-secrets = { workspace = true }

axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# The pool patch takes durations in the same humantime spelling the state file
# uses, so `"30s"` means the same thing on both sides of the API.
humantime-serde = { workspace = true }
mime_guess = { workspace = true }
rust-embed = { workspace = true, optional = true }

[dev-dependencies]
# A protocol-less family. Not `havuz-pg`: if the admin API could only be tested
# against a real codec, "this crate does not depend on Postgres" would be an
# assertion nobody checks.
havuz-control = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["rt", "macros"] }
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
